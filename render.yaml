services:
  # ── Backend: Node.js/Express API ──────────────────────────────
  - type: web
    name: seo-cro-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # You'll paste this in Render dashboard
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /data
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  # ── Frontend: Vite Static Site ────────────────────────────────
  - type: web
    name: seo-cro-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: seo-cro-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
